<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UzhavGrow</title>
<meta name="description" content="UzhavGrow connects small and marginal farmers with satellite insight, shared technology and direct market access.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
html{scroll-behavior:smooth}
body{margin:0;font-family:'Inter','Noto Sans Tamil','Noto Sans Devanagari',system-ui,sans-serif;color:#17302B;background:#F6F8F7;line-height:1.6}
a{color:inherit}
h1,h2,h3,p{margin:0}
.hd{font-family:'Space Grotesk','Noto Sans Tamil','Noto Sans Devanagari',system-ui,sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px;box-sizing:border-box}
.nav{text-decoration:none;color:#C9DDD6;padding:8px 2px}
.nav:hover{color:#FFFFFF}
.lang{font:inherit;font-size:14px;font-weight:600;border:1px solid #4F7A6E;border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer;background:transparent;color:#E6F1ED}
.lang:hover{border-color:#9FD9C4}
.lang[aria-pressed="true"]{background:#4ADE9A;color:#06231D;border-color:#4ADE9A}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 24px;border-radius:10px;font-weight:600;font-size:16px;text-decoration:none;box-sizing:border-box}
.btn:hover{filter:brightness(1.08)}
a:focus-visible,button:focus-visible{outline:3px solid #8FD3FF;outline-offset:2px}
.card{background:#FFFFFF;border:1px solid #D6E4DD;border-radius:12px;box-sizing:border-box}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;color:#5B746C;background:#EDF3F0;border-radius:6px;padding:3px 8px}
.sec{padding:80px 0}
.h2{font-size:clamp(28px,3.4vw,40px);line-height:1.25;font-weight:600;text-wrap:balance}
.lead{font-size:18px;color:#4B645C;max-width:640px}
.row{display:flex;flex-wrap:wrap}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:#4B645C}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.map{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;border-radius:8px;overflow:hidden;background:#FFFFFF}
.map div{aspect-ratio:1}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(250px)}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes ping{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes pulse{50%{opacity:.5}}
.sweep{animation:sweep 6s ease-in-out infinite alternate}
.flow{stroke-dasharray:8 10;animation:flow 1.1s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sweep,.flow,.ping,.pulse{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<!-- HERO -->

<span class="hd" style="font-size:22px;font-weight:700;letter-spacing:-.01em">UzhavGrow</span>
</a>
<nav style="display:flex;flex-wrap:wrap;gap:4px 20px;font-size:15px">
<a class="nav" href="#problem" data-t="navProblem"></a>
<a class="nav" href="#how" data-t="navHow"></a>
<a class="nav" href="#tech" data-t="navTech"></a>
<a class="nav" href="#market" data-t="navMarket"></a>
<a class="nav" href="#model" data-t="navModel"></a>
<a class="nav" href="#join" data-t="navJoin"></a>

<p data-t="heroSub" style="margin:0 0 28px;font-size:18px;line-height:1.65;color:#C9DDD6;max-width:560px"></p>
<div class="row" style="gap:12px">
<a class="btn" href="#join" data-t="cta1" style="background:#4ADE9A;color:#06231D"></a>
<a class="btn" href="#how" data-t="cta2" style="border:1px solid #6FA596;color:#F2F7F5"></a>
</div>
<div class="row" style="gap:10px 18px;margin-top:32px;font-size:14px;color:#C9DDD6">
<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:#7CC14F"></span><span data-t="chipCrop"></span></span>
<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:#4FB3F0"></span><span data-t="chipWater"></span></span>
<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:#D9A25B"></span><span data-t="chipSoil"></span></span>
</div>
</div>

</g>
</g>
</svg>
<div data-t="heroCaption" style="text-align:center;font-size:13px;color:#A9C4BC;margin-top:6px"></div>
</div>
</div>
</div>
</section>

<!-- PROBLEM -->

<div class="wrap">
<h2 class="hd h2" data-t="probTitle" style="margin-bottom:12px"></h2>
<p class="lead" data-t="probSub" style="margin-bottom:36px"></p>

</section>

<!-- IOT + DRONES -->
<section id="field" class="sec" style="background:#F6F8F7">
<div class="wrap">

<!-- MARKET -->

    if (css) n.style.cssText = css;
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function check(bg, stroke) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", "20"); s.setAttribute("height", "20"); s.setAttribute("viewBox", "0 0 20 20");
    s.setAttribute("aria-hidden", "true"); s.style.cssText = "flex:none;margin-top:3px";
    var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", "10"); c.setAttribute("cy", "10"); c.setAttribute("r", "10"); c.setAttribute("fill", bg);
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M5.5 10.5l3 3 6-6.5"); p.setAttribute("fill", "none"); p.setAttribute("stroke", stroke);
    p.setAttribute("stroke-width", "2"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
    s.appendChild(c); s.appendChild(p);
    return s;
  }

  function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }); }
  function ramp(stops, v) {
    for (var i = 1; i < stops.length; i++) {
      if (v <= stops[i][0] || i === stops.length - 1) {
        var a0 = stops[i - 1][0], a1 = stops[i][0];
        var A = hex(stops[i - 1][1]), B = hex(stops[i][1]);
        var k = Math.min(1, Math.max(0, (v - a0) / (a1 - a0)));
        return "rgb(" + A.map(function (x, j) { return Math.round(x + (B[j] - x) * k); }).join(",") + ")";
      }
    }
    return "#888";
  }
  function buildMaps() {
    var cropStops = [[0, "#D64545"], [0.4, "#E8B33A"], [0.7, "#7DBF4A"], [1, "#1F8A4C"]];
    var soilStops = [[0, "#E9D8B4"], [0.5, "#B58A55"], [1, "#6E4526"]];
    var crop = document.getElementById("cropCells");
    var soil = document.getElementById("soilCells");
    for (var r = 0; r < 8; r++) {
      for (var c = 0; c < 12; c++) {
        var a = Math.sin(c * 0.62 + r * 0.35) + Math.cos(r * 0.9 - c * 0.25);
        var v = (a + 2) / 4;
        var block = Math.floor(c / 4) + Math.floor(r / 4) * 3;
        v = Math.min(1, Math.max(0, v * 0.7 + (block % 3) * 0.12));
        var d = document.createElement("div");
        d.style.background = ramp(cropStops, v);
        if (v < 0.3) d.className = "pulse";
        crop.appendChild(d);
        var w = 0.5 + 0.5 * Math.sin(c * 0.45 + 0.4) * Math.cos(r * 0.6 + 1);
        var s = document.createElement("div");
        s.style.background = ramp(soilStops, Math.min(1, Math.max(0, w)));
        soil.appendChild(s);
      }
    }
  }
  function buildBars() {
    var area = document.getElementById("barsArea");
    var labels = document.getElementById("barsLabels");
    harvest.forEach(function (h, i) {
      var g = el("div", "flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px");
      g.appendChild(el("div", "width:42%;height:" + h + "%;background:#2E9D5C;border-radius:3px 3px 0 0"));
      g.appendChild(el("div", "width:42%;height:" + demand[i] + "%;background:#E3A21A;border-radius:3px 3px 0 0"));
      area.appendChild(g);
      labels.appendChild(el("div", "flex:1;min-width:0;text-align:center;font-size:12.5px;color:#4B645C", String(i + 1)));
    });
  }

  function renderLists() {
    var n = document.getElementById("problems"); clear(n);
    problems.forEach(function (p) {
      var c = el("div", "flex:1 1 240px;min-width:0;padding:24px"); c.className = "card";
      var h = el("h3", "margin:0 0 10px;font-size:20px;line-height:1.3;font-weight:600", p[0][lang]); h.className = "hd";
      c.appendChild(h); c.appendChild(el("p", "font-size:15.5px;color:#4B645C", p[1][lang]));
      n.appendChild(c);
    });
    n = document.getElementById("steps"); clear(n);
    steps.forEach(function (s, i) {
      var c = el("div", "flex:1 1 320px;min-width:0;display:flex;gap:16px;padding:22px;background:#F6F8F7;border:1px solid #DCE8E2;border-radius:12px;box-sizing:border-box");
      var num = el("div", "flex:none;width:40px;height:40px;border-radius:50%;background:#0B2B27;color:#4ADE9A;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center", String(i + 1)); num.className = "hd";
      var b = el("div", "min-width:0");
      var h = el("h3", "margin:0 0 6px;font-size:19px;line-height:1.3;font-weight:600", s[0][lang]); h.className = "hd";
      b.appendChild(h); b.appendChild(el("p", "font-size:15.5px;color:#4B645C", s[1][lang]));
      c.appendChild(num); c.appendChild(b); n.appendChild(c);
    });
    n = document.getElementById("sensors"); clear(n);
    sensors.forEach(function (s) {
      var c = el("div", "display:flex;gap:14px;align-items:flex-start;padding:18px 20px"); c.className = "card";
      c.appendChild(el("span", "flex:none;width:12px;height:12px;border-radius:50%;margin-top:7px;background:" + s[0]));
      var b = el("div", "min-width:0");
      var h = el("h3", "margin:0 0 4px;font-size:18px;line-height:1.3;font-weight:600", s[1][lang]); h.className = "hd";
      b.appendChild(h); b.appendChild(el("p", "font-size:15px;color:#4B645C", s[2][lang]));
      c.appendChild(b); n.appendChild(c);
    });
    n = document.getElementById("chain"); clear(n);
    chain.forEach(function (c) {
      var d = el("div", "flex:1 1 220px;min-width:0;position:relative;border-top:2px solid #7DB59C;padding-top:22px");
      d.appendChild(el("span", "position:absolute;top:-8px;left:0;width:14px;height:14px;border-radius:50%;background:#2E9D5C;border:3px solid #E8F1EC;box-sizing:content-box"));
      var h = el("h3", "font-size:19px;line-height:1.35;font-weight:600", c[lang]); h.className = "hd";
      d.appendChild(h); n.appendChild(d);
    });
    function pts(id, list, bg, stroke) {
      var box = document.getElementById(id); clear(box);
      list.forEach(function (t) {
        var r = el("div", "display:flex;gap:12px;align-items:flex-start;font-size:16px");
        r.appendChild(check(bg, stroke)); r.appendChild(el("span", "min-width:0", t[lang]));
        box.appendChild(r);
      });
    }
    pts("farmerPts", farmerPts, "#DDF3E6", "#1E7A46");
    pts("companyPts", companyPts, "#14463E", "#4ADE9A");
  }

  function renderLangButtons() {
    var box = document.getElementById("langs"); clear(box);
    NAMES.forEach(function (name, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "lang"; b.textContent = name;
      b.setAttribute("aria-pressed", i === lang ? "true" : "false");
      b.addEventListener("click", function () {
        lang = i;
        try { localStorage.setItem("uzhavgrow-lang", CODES[i]); } catch (e) {}
        render();
      });
      box.appendChild(b);
    });
  }

  function render() {
    document.documentElement.lang = CODES[lang];
    document.querySelectorAll("[data-t]").forEach(function (n) {
      var k = n.getAttribute("data-t");
      if (S[k]) n.textContent = S[k][lang];
    });
    document.querySelectorAll("[data-aria]").forEach(function (n) {
      var k = n.getAttribute("data-aria");
      if (S[k]) n.setAttribute("aria-label", S[k][lang]);
    });
    renderLangButtons();
    renderLists();
  }

  buildMaps();
  buildBars();
  render();
})();
</script>
</body>
</html>
